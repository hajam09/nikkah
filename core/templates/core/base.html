<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nikkah{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar bg-light border-bottom">
        <div class="container">
            <a class="navbar-brand" href="{% url 'core:index-view' %}">Nikkah</a>
            <div class="d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                    <span class="text-muted">{{ user.username }}</span>
                    <a class="btn btn-outline-primary btn-sm" href="{% url 'core:settings-personal' %}">Settings</a>
                    <form method="post" action="{% url 'core:logout-view' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-secondary btn-sm" type="submit">Log out</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-primary btn-sm" href="{% url 'core:login-view' %}">Log in</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
